<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zoteroobsidianbridge/content/desktop-window-prototype.css"
type="text/css"?>
<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="zob-desktop-window-prototype"
  title="Bridge desktop window prototype"
  width="480"
  height="360"
  persist="width height screenX screenY"
>
  <html:head>
    <html:meta charset="utf-8" />
    <html:title>Bridge desktop window prototype</html:title>
    <html:script
      src="chrome://zoteroobsidianbridge/content/scripts/zoteroobsidianbridge-editor.js"
    />
  </html:head>
  <html:body>
    <html:main id="prototype" data-ready="false">
      <html:header>
        <html:h1 id="card-title">Loading prototype...</html:h1>
        <html:button id="close-window" type="button">Close</html:button>
      </html:header>
      <html:p id="card-path"></html:p>
      <html:article id="card-body"></html:article>
      <html:footer id="window-state"
        >Initializing packaged window...</html:footer
      >
    </html:main>
  </html:body>
</html>
