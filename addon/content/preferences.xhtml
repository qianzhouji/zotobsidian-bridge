<linkset xmlns:html="http://www.w3.org/1999/xhtml">
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-vaultPath"
      data-l10n-id="pref-vault-path"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-vaultPath"
    ></html:input>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-browseVault"
      data-l10n-id="pref-browse-vault"
    ></html:button>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-outputFolder"
      data-l10n-id="pref-output-folder"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-outputFolder"
    ></html:input>
  </hbox>
  <hbox>
    <html:label data-l10n-id="pref-output-preview"></html:label>
    <html:code id="zotero-prefpane-__addonRef__-outputPreview"></html:code>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-writerMode"
      data-l10n-id="pref-writer-mode"
    ></html:label>
    <html:select id="zotero-prefpane-__addonRef__-writerMode">
      <html:option
        value="direct"
        data-l10n-id="pref-writer-direct"
      ></html:option>
      <html:option
        value="companion"
        data-l10n-id="pref-writer-companion"
      ></html:option>
    </html:select>
  </hbox>
  <groupbox xmlns:html="http://www.w3.org/1999/xhtml">
    <caption data-l10n-id="pref-reader-title"></caption>
    <hbox>
      <html:label
        for="zotero-prefpane-__addonRef__-readerMode"
        data-l10n-id="pref-reader-mode"
      ></html:label>
      <html:select id="zotero-prefpane-__addonRef__-readerMode">
        <html:option
          value="native"
          data-l10n-id="pref-reader-native"
        ></html:option>
        <html:option
          value="bridge"
          data-l10n-id="pref-reader-bridge"
        ></html:option>
      </html:select>
    </hbox>
    <html:p data-l10n-id="pref-reader-description"></html:p>
    <hbox>
      <html:label
        for="zotero-prefpane-__addonRef__-desktopKnowledgeCards"
        data-l10n-id="pref-desktop-knowledge-cards"
      ></html:label>
      <html:input
        type="checkbox"
        id="zotero-prefpane-__addonRef__-desktopKnowledgeCards"
      ></html:input>
    </hbox>
    <html:p data-l10n-id="pref-desktop-knowledge-cards-description"></html:p>
    <hbox>
      <html:label
        for="zotero-prefpane-__addonRef__-inlineKnowledgeCardLines"
        data-l10n-id="pref-inline-knowledge-card-lines"
      ></html:label>
      <html:input
        type="checkbox"
        id="zotero-prefpane-__addonRef__-inlineKnowledgeCardLines"
      ></html:input>
    </hbox>
    <html:p
      data-l10n-id="pref-inline-knowledge-card-lines-description"
    ></html:p>
    <hbox>
      <html:label
        for="zotero-prefpane-__addonRef__-desktopKnowledgeCardLines"
        data-l10n-id="pref-desktop-knowledge-card-lines"
      ></html:label>
      <html:input
        type="checkbox"
        id="zotero-prefpane-__addonRef__-desktopKnowledgeCardLines"
      ></html:input>
    </hbox>
    <html:p
      data-l10n-id="pref-desktop-knowledge-card-lines-description"
    ></html:p>
    <hbox>
      <html:button
        type="button"
        id="zotero-prefpane-__addonRef__-desktopOverlayProbe"
        data-l10n-id="pref-desktop-overlay-probe"
      ></html:button>
      <html:button
        type="button"
        id="zotero-prefpane-__addonRef__-desktopOverlayProbeStop"
        data-l10n-id="pref-desktop-overlay-probe-stop"
        hidden="hidden"
      ></html:button>
      <html:span
        id="zotero-prefpane-__addonRef__-desktopOverlayProbeStatus"
        role="status"
        aria-live="polite"
      ></html:span>
    </hbox>
    <html:p data-l10n-id="pref-desktop-overlay-probe-description"></html:p>
    <html:span
      id="zotero-prefpane-__addonRef__-readerModeStatus"
      role="status"
      aria-live="polite"
    ></html:span>
  </groupbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-companionQueuePath"
      data-l10n-id="pref-companion-queue-path"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-companionQueuePath"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-companionVaultId"
      data-l10n-id="pref-companion-vault-id"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-companionVaultId"
    ></html:input>
  </hbox>
  <hbox>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-checkSetup"
      data-l10n-id="pref-check-setup"
    ></html:button>
    <html:span
      id="zotero-prefpane-__addonRef__-setupStatus"
      role="status"
      aria-live="polite"
    ></html:span>
  </hbox>
</groupbox>
<groupbox xmlns:html="http://www.w3.org/1999/xhtml">
  <caption data-l10n-id="pref-auto-title"></caption>
  <html:p data-l10n-id="pref-auto-semantics"></html:p>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-autoEnabled"
      data-l10n-id="pref-auto-enabled"
    ></html:label>
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-autoEnabled"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-autoPaused"
      data-l10n-id="pref-auto-paused"
    ></html:label>
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-autoPaused"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-scopeLibrary"
      data-l10n-id="pref-auto-library"
    ></html:label>
    <html:select id="zotero-prefpane-__addonRef__-scopeLibrary"></html:select>
    <html:label
      for="zotero-prefpane-__addonRef__-scopeKind"
      data-l10n-id="pref-auto-kind"
    ></html:label>
    <html:select id="zotero-prefpane-__addonRef__-scopeKind">
      <html:option
        value="library"
        data-l10n-id="pref-auto-kind-library"
      ></html:option>
      <html:option
        value="collections"
        data-l10n-id="pref-auto-kind-collections"
      ></html:option>
      <html:option
        value="tags"
        data-l10n-id="pref-auto-kind-tags"
      ></html:option>
      <html:option
        value="both"
        data-l10n-id="pref-auto-kind-both"
      ></html:option>
    </html:select>
  </hbox>
  <hbox>
    <html:select
      id="zotero-prefpane-__addonRef__-scopeCollections"
      multiple="multiple"
      size="6"
    ></html:select>
    <html:select
      id="zotero-prefpane-__addonRef__-scopeTags"
      multiple="multiple"
      size="6"
    ></html:select>
  </hbox>
  <hbox id="zotero-prefpane-__addonRef__-scopeDescendantsRow">
    <html:label
      for="zotero-prefpane-__addonRef__-scopeDescendants"
      data-l10n-id="pref-auto-descendants"
    ></html:label>
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-scopeDescendants"
    ></html:input>
  </hbox>
  <hbox>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-addScope"
      data-l10n-id="pref-auto-add-scope"
    ></html:button>
  </hbox>
  <html:div id="zotero-prefpane-__addonRef__-scopeList"></html:div>
  <hbox>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-previewScopes"
      data-l10n-id="pref-auto-preview"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-importHistory"
      data-l10n-id="pref-auto-import"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-resumeBatch"
      data-l10n-id="pref-auto-resume"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-cancelBatch"
      data-l10n-id="pref-auto-cancel"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-retryAuto"
      data-l10n-id="pref-auto-retry"
    ></html:button>
  </hbox>
  <html:pre id="zotero-prefpane-__addonRef__-autoStatus"></html:pre>
</groupbox>
<groupbox xmlns:html="http://www.w3.org/1999/xhtml">
  <caption data-l10n-id="pref-sync-title"></caption>
  <hbox>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-refreshStatus"
      data-l10n-id="pref-sync-refresh"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-retrySync"
      data-l10n-id="pref-sync-retry"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-reconcile"
      data-l10n-id="pref-sync-reconcile"
    ></html:button>
    <html:button
      type="button"
      id="zotero-prefpane-__addonRef__-exportDiagnostics"
      data-l10n-id="pref-export-diagnostics"
    ></html:button>
  </hbox>
  <html:pre id="zotero-prefpane-__addonRef__-syncStatus"></html:pre>
  <html:div id="zotero-prefpane-__addonRef__-syncTaskActions"></html:div>
</groupbox>
<vbox xmlns:html="http://www.w3.org/1999/xhtml">
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
